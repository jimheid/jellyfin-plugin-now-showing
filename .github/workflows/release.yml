name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.NowShowing/Jellyfin.Plugin.NowShowing.csproj

      - name: Publish
        run: dotnet publish Jellyfin.Plugin.NowShowing/Jellyfin.Plugin.NowShowing.csproj -c Release --no-self-contained -o publish

      - name: Package
        run: |
          mkdir -p package
          cp publish/Jellyfin.Plugin.NowShowing.dll package/
          cp README.md LICENSE CHANGELOG.md package/
          cd package
          zip -r ../Now-Showing-${GITHUB_REF_NAME}.zip .
          cd ..
          sha256sum Now-Showing-${GITHUB_REF_NAME}.zip > Now-Showing-${GITHUB_REF_NAME}.zip.sha256
          md5sum Now-Showing-${GITHUB_REF_NAME}.zip > Now-Showing-${GITHUB_REF_NAME}.zip.md5

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Now-Showing-${{ github.ref_name }}
          path: |
            Now-Showing-${{ github.ref_name }}.zip
            Now-Showing-${{ github.ref_name }}.zip.sha256
            Now-Showing-${{ github.ref_name }}.zip.md5

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Now-Showing-${{ github.ref_name }}.zip
            Now-Showing-${{ github.ref_name }}.zip.sha256
            Now-Showing-${{ github.ref_name }}.zip.md5
          generate_release_notes: true
